[project]
name = "karmabound"
version = "0.3.0"
description = "Torneio dark fantasy por turnos em que poderes, técnicas e destino saem de uma roleta, e o azar acumulado vira Despertar."
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    # Precisa do M16 (primitivas de UI e fontes customizadas).
    "ouroboros-engine @ git+https://github.com/EzioMilanoX/OuroborosEngine.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
